sonar.projectKey=worklenz
sonar.projectName=Worklenz
sonar.sourceEncoding=UTF-8

sonar.sources=worklenz-backend/src,worklenz-frontend/src,worklenz-client-portal/src
sonar.tests=worklenz-backend/src/tests,worklenz-frontend/src/test,worklenz-client-portal/src/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/vendor/**,**/.git/**,**/src/tests/**,**/src/test/**

sonar.javascript.lcov.reportPaths=worklenz-frontend/coverage/lcov.info
